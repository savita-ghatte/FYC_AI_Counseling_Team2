version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aicounsellor-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aicounsellor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword}
      POSTGRES_DB: ${POSTGRES_DB:-aicounsellor_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - aicounsellor-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aicounsellor-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aicounsellor}:${POSTGRES_PASSWORD:-securepassword}@db:5432/${POSTGRES_DB:-aicounsellor_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_super_secret_refresh_key}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./uploads:/app/uploads
    networks:
      - aicounsellor-network
    command: >
      sh -c "npx prisma migrate deploy && npm start"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aicounsellor-frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - aicounsellor-network

networks:
  aicounsellor-network:
    driver: bridge

volumes:
  pgdata:
